services:
  postgres:
    image: postgres:16-alpine
    container_name: trades_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: trades_dev_password
      POSTGRES_DB: trades_platform
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trades -d trades_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trades_redis
    restart: unless-stopped
    ports:
      - '16379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
